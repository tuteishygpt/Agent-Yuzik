server {
    server_name yuzik.tuteishygpt.pro;
    location / {
        proxy_pass http://127.0.0.1:7861;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yuzik.tuteishygpt.pro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yuzik.tuteishygpt.pro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = yuzik.tuteishygpt.pro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name yuzik.tuteishygpt.pro;
    return 404; # managed by Certbot
}
