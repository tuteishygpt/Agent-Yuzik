<!DOCTYPE html>
<html lang="be">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галасавы Агент - Юзік</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles.css">
    <style>
        :root {
            --primary: #4e82ee;
            --primary-glow: rgba(78, 130, 238, 0.4);
            --bg-dark: #0f111a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0b0;
        }

        body {
            background: var(--bg-dark);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(78, 130, 238, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(130, 78, 238, 0.15) 0%, transparent 40%);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        .voice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 2rem;
            gap: 2.5rem;
        }

        .voice-title {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff 0%, #a0a0b0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .mic-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-halo {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--primary-glow);
            filter: blur(20px);
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 0;
        }

        .mic-container.listening~.mic-halo {
            background: rgba(255, 68, 102, 0.4);
            opacity: 1;
            animation: halo-pulse 2s infinite;
        }

        .mic-container.processing~.mic-halo {
            background: rgba(255, 170, 0, 0.4);
            opacity: 1;
            animation: halo-pulse 3s infinite linear;
        }

        .mic-container.speaking~.mic-halo {
            background: rgba(68, 255, 170, 0.4);
            opacity: 1;
            animation: halo-pulse 1.5s infinite;
        }

        @keyframes halo-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.4);
                opacity: 0.5;
            }
        }

        .mic-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .mic-container:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary);
        }

        .mic-container.listening {
            border-color: #ff4466;
            background: rgba(255, 68, 102, 0.15);
            transform: scale(1.1);
            animation: mic-pulse 1.5s ease-in-out infinite;
        }

        @keyframes mic-pulse {

            0%,
            100% {
                transform: scale(1.1);
                box-shadow: 0 0 20px rgba(255, 68, 102, 0.2);
            }

            50% {
                transform: scale(1.15);
                box-shadow: 0 0 35px rgba(255, 68, 102, 0.4);
            }
        }

        .mic-container.processing {
            border-color: transparent;
            background: rgba(255, 170, 0, 0.1);
        }

        .mic-container.processing::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(90deg, #ffaa00, transparent, #ffaa00);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotate-border 1.5s linear infinite;
        }

        @keyframes rotate-border {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .mic-container.speaking {
            border-color: #44ffaa;
            background: rgba(68, 255, 170, 0.1);
            animation: mic-ripple 1s linear infinite;
        }

        @keyframes mic-ripple {
            0% {
                box-shadow: 0 0 0 0 rgba(68, 255, 170, 0.4);
            }

            100% {
                box-shadow: 0 0 0 30px rgba(68, 255, 170, 0);
            }
        }

        .status-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.5px;
            height: 1.5rem;
            transition: all 0.3s ease;
        }

        .status-text.active {
            color: var(--text-primary);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .audio-visualizer {
            width: 100%;
            max-width: 320px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.5s ease;
        }

        .audio-visualizer.processing {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .visualizer-bar {
            width: 6px;
            background: var(--primary);
            border-radius: 10px;
            height: 15%;
            transition: height 0.15s ease-out, background 0.3s ease;
            opacity: 0.7;
        }

        .listening .visualizer-bar {
            background: #ff4466;
            box-shadow: 0 0 10px rgba(255, 68, 102, 0.3);
        }

        .speaking .visualizer-bar {
            background: #44ffaa;
            box-shadow: 0 0 10px rgba(68, 255, 170, 0.3);
        }

        .processing .visualizer-bar {
            background: #ffaa00;
            animation: bar-loading 1s infinite ease-in-out;
        }

        @keyframes bar-loading {

            0%,
            100% {
                height: 15%;
            }

            50% {
                height: 40%;
            }
        }

        .visualizer-bar:nth-child(even) {
            animation-delay: 0.2s;
        }

        .visualizer-bar:nth-child(3n) {
            animation-delay: 0.4s;
        }

        .transcript-box {
            width: 100%;
            max-width: 600px;
            max-height: 35vh;
            overflow-y: auto;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem 2rem;
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .transcript-box::-webkit-scrollbar {
            width: 6px;
        }

        .transcript-box::-webkit-scrollbar-track {
            background: transparent;
        }

        .transcript-box::-webkit-scrollbar-thumb {
            background-color: var(--primary);
            border-radius: 20px;
        }

        .transcript-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: block;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
        }

        .transcript-text {
            color: var(--text-primary);
            font-size: 1.1rem;
            line-height: 1.6;
            font-weight: 400;
            word-wrap: break-word;
        }

        .voice-controls {
            display: flex;
            gap: 1.5rem;
        }

        .voice-btn {
            padding: 0.8rem 2.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid transparent;
        }

        .voice-btn.primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .voice-btn.primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .voice-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: var(--glass-border);
        }

        .voice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .connection-status {
            position: absolute;
            top: 2rem;
            right: 2rem;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .connection-status.connected .status-dot {
            background: #44ffaa;
            box-shadow: 0 0 10px #44ffaa;
        }

        .connection-status.disconnected .status-dot {
            background: #ff4466;
            box-shadow: 0 0 10px #ff4466;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* ===========================
           Performance Log Panel
           =========================== */
        .perf-toggle-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(78, 130, 238, 0.2);
            border: 1px solid rgba(78, 130, 238, 0.4);
            color: #4e82ee;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(78, 130, 238, 0.2);
        }

        .perf-toggle-btn:hover {
            background: rgba(78, 130, 238, 0.35);
            transform: scale(1.1);
        }

        .perf-toggle-btn.has-new {
            animation: pulse-badge 1.5s infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { box-shadow: 0 4px 15px rgba(78, 130, 238, 0.2); }
            50% { box-shadow: 0 4px 25px rgba(78, 130, 238, 0.6); }
        }

        .perf-panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100vh;
            background: rgba(12, 14, 24, 0.97);
            border-left: 1px solid rgba(78, 130, 238, 0.2);
            backdrop-filter: blur(20px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            transition: right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.5);
        }

        .perf-panel.open {
            right: 0;
        }

        .perf-panel-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .perf-panel-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .perf-panel-actions {
            display: flex;
            gap: 0.5rem;
        }

        .perf-action-btn {
            padding: 0.3rem 0.7rem;
            font-size: 0.7rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .perf-action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .perf-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(78, 130, 238, 0.3) transparent;
        }

        .perf-panel-body::-webkit-scrollbar {
            width: 5px;
        }

        .perf-panel-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .perf-panel-body::-webkit-scrollbar-thumb {
            background: rgba(78, 130, 238, 0.3);
            border-radius: 10px;
        }

        /* ── Session divider ── */
        .perf-session-divider {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.8rem 1.2rem 0.4rem;
            margin-top: 0.4rem;
        }

        .perf-session-divider::before,
        .perf-session-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(78, 130, 238, 0.15);
        }

        .perf-session-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(78, 130, 238, 0.6);
            white-space: nowrap;
        }

        /* ── Log entry ── */
        .perf-entry {
            padding: 0.6rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s ease;
            animation: fadeInEntry 0.3s ease;
        }

        @keyframes fadeInEntry {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .perf-entry:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .perf-entry-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.25rem;
        }

        .perf-entry-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .perf-entry-time {
            font-size: 0.68rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
        }

        .perf-entry-detail {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 0.15rem;
        }

        .perf-entry-elapsed {
            display: inline-block;
            font-size: 0.65rem;
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            margin-top: 0.3rem;
        }

        /* Color coding for event types */
        .perf-entry[data-event="audio_received"] .perf-entry-elapsed,
        .perf-entry[data-event="user_message"] .perf-entry-elapsed {
            background: rgba(78, 130, 238, 0.15);
            color: #7aa8ff;
        }

        .perf-entry[data-event="llm_start"] .perf-entry-elapsed,
        .perf-entry[data-event="llm_stream_started"] .perf-entry-elapsed,
        .perf-entry[data-event="llm_first_token"] .perf-entry-elapsed {
            background: rgba(255, 170, 0, 0.15);
            color: #ffcc55;
        }

        .perf-entry[data-event="llm_complete"] .perf-entry-elapsed {
            background: rgba(68, 255, 170, 0.15);
            color: #44ffaa;
        }

        .perf-entry[data-event="tts_start"] .perf-entry-elapsed,
        .perf-entry[data-event="tts_first_chunk"] .perf-entry-elapsed {
            background: rgba(200, 100, 255, 0.15);
            color: #d090ff;
        }

        .perf-entry[data-event="pipeline_complete"] .perf-entry-elapsed {
            background: rgba(68, 255, 170, 0.2);
            color: #44ffaa;
            font-size: 0.72rem;
        }

        .perf-entry[data-event="audio_playback_start"] .perf-entry-elapsed {
            background: rgba(255, 68, 102, 0.15);
            color: #ff6688;
        }

        /* ── Empty state ── */
        .perf-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            gap: 0.8rem;
        }

        .perf-empty-icon {
            font-size: 2.5rem;
            opacity: 0.4;
        }

        .perf-empty-text {
            font-size: 0.85rem;
            opacity: 0.6;
        }

        /* ===========================
           Responsive Styles
           =========================== */
        @media (max-width: 600px) {
            .voice-container {
                padding: 1.5rem 1rem;
                gap: 1.5rem;
            }

            .voice-title {
                font-size: 1.4rem;
                text-align: center;
            }

            .mic-container {
                width: 110px;
                height: 110px;
                font-size: 2.8rem;
            }

            .mic-halo {
                width: 140px;
                height: 140px;
            }

            .audio-visualizer {
                height: 80px;
                gap: 4px;
            }

            .visualizer-bar {
                width: 4px;
            }

            .transcript-box {
                padding: 1rem 1.25rem;
                max-height: 40vh;
            }

            .transcript-text {
                font-size: 1rem;
            }

            .voice-controls {
                gap: 1rem;
                width: 100%;
                justify-content: center;
            }

            .voice-btn {
                padding: 0.7rem 1.5rem;
                font-size: 0.95rem;
                flex: 1;
                max-width: 160px;
                justify-content: center;
            }

            .connection-status {
                top: 1rem;
                right: 1rem;
                padding: 0.4rem 0.8rem;
                font-size: 0.7rem;
            }

            .perf-panel {
                width: 100%;
                right: -100%;
            }

            .perf-toggle-btn {
                bottom: 1rem;
                right: 1rem;
                width: 42px;
                height: 42px;
            }
        }

        @media (max-height: 700px) {
            .voice-container {
                gap: 1rem;
            }

            .mic-container {
                width: 100px;
                height: 100px;
            }

            .transcript-box {
                max-height: 30vh;
            }
        }
    </style>
</head>

<body>
    <div class="voice-container">
        <div class="connection-status disconnected" id="connection-status">
            <span class="status-dot"></span>
            <span id="connection-text">Адключана</span>
        </div>

        <h1 class="voice-title">🎙️ Галасавы Агент - Юзік</h1>

        <div class="mic-wrapper">
            <div class="mic-container" id="mic-btn">
                🎤
            </div>
            <div class="mic-halo"></div>
        </div>

        <p class="status-text" id="status-text">Націсніце на мікрафон для пачатку</p>

        <div class="audio-visualizer" id="visualizer">
            <!-- Visualizer bars will be generated by JS -->
        </div>

        <div class="transcript-box">
            <p class="transcript-label">📝 Транскрыпцыя:</p>
            <p class="transcript-text" id="transcript">Тут будзе паказаны тэкст размовы...</p>
        </div>

        <div class="voice-controls">
            <button class="voice-btn primary" id="start-btn">🎤 Пачаць</button>
            <button class="voice-btn secondary" id="stop-btn" disabled>⏹️ Спыніць</button>
        </div>
    </div>

    <!-- Performance Log Panel -->
    <button class="perf-toggle-btn" id="perf-toggle" title="Логі прадукцыйнасці">
        📊
    </button>

    <div class="perf-panel" id="perf-panel">
        <div class="perf-panel-header">
            <div class="perf-panel-title">📊 Логі прадукцыйнасці</div>
            <div class="perf-panel-actions">
                <button class="perf-action-btn" id="perf-clear">🗑️ Ачысціць</button>
                <button class="perf-action-btn" id="perf-close">✕</button>
            </div>
        </div>
        <div class="perf-panel-body" id="perf-log-body">
            <div class="perf-empty">
                <div class="perf-empty-icon">📊</div>
                <div class="perf-empty-text">Пачніце размову, каб бачыць логі</div>
            </div>
        </div>
    </div>

    <!-- ONNX Runtime for VAD - use bundled version to avoid CORS issues -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.min.js"></script>
    <script>
        // Configure ONNX Runtime WASM paths - use v1.14.0 which is more compatible
        if (window.ort) {
            ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/';
            ort.env.wasm.numThreads = 1;
            ort.env.wasm.simd = true;
        }
    </script>
    <!-- Silero VAD Library - use v0.0.18 which works with onnxruntime-web 1.14 -->
    <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.18/dist/bundle.min.js"></script>
    <script type="module" src="/src/voice.js"></script>
</body>

</html>
