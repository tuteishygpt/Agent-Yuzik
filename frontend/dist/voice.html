<!DOCTYPE html>
<html lang="be">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галасавы Агент - Юзік</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/voice-oRd4RJ68.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/styles-C9UiR0sO.js">
  <link rel="stylesheet" crossorigin href="/assets/styles-BRW-3hpf.css">
  <link rel="stylesheet" crossorigin href="/assets/voice-D_JTGCVN.css">
</head>

<body>
    <div class="voice-container">
        <div class="connection-status disconnected" id="connection-status">
            <span class="status-dot"></span>
            <span id="connection-text">Адключана</span>
        </div>

        <h1 class="voice-title">🎙️ Галасавы Агент - Юзік</h1>

        <div class="mic-wrapper">
            <div class="mic-container" id="mic-btn">
                <svg class="state-icon icon-listen" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="22" y="6" width="20" height="32" rx="10" fill="currentColor" opacity="0.95" />
                    <path d="M12 32c0 11 9 20 20 20s20-9 20-20" stroke="currentColor" stroke-width="4"
                        stroke-linecap="round" fill="none" />
                    <line x1="32" y1="52" x2="32" y2="60" stroke="currentColor" stroke-width="4"
                        stroke-linecap="round" />
                    <line x1="22" y1="60" x2="42" y2="60" stroke="currentColor" stroke-width="4"
                        stroke-linecap="round" />
                </svg>

                <svg class="state-icon icon-think" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="32" cy="32" r="6" fill="currentColor" />
                    <path d="M32 4 L38 20 L32 26 L26 20 Z" fill="currentColor" opacity="0.9" />
                    <path d="M32 60 L38 44 L32 38 L26 44 Z" fill="currentColor" opacity="0.9" />
                    <path d="M4 32 L20 26 L26 32 L20 38 Z" fill="currentColor" opacity="0.9" />
                    <path d="M60 32 L44 26 L38 32 L44 38 Z" fill="currentColor" opacity="0.9" />
                    <path d="M12 12 L24 22 L18 28 L8 18 Z" fill="currentColor" opacity="0.7" />
                    <path d="M52 52 L40 42 L46 36 L56 46 Z" fill="currentColor" opacity="0.7" />
                    <path d="M12 52 L22 40 L28 46 L18 56 Z" fill="currentColor" opacity="0.7" />
                    <path d="M52 12 L42 22 L36 16 L46 6 Z" fill="currentColor" opacity="0.7" />
                </svg>

                <svg class="state-icon icon-speak" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="10,22 26,22 38,10 38,54 26,42 10,42" fill="currentColor" opacity="0.95" />
                    <path d="M44 22 Q52 32 44 42" stroke="currentColor" stroke-width="4" stroke-linecap="round"
                        fill="none" />
                    <path d="M49 16 Q61 32 49 48" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"
                        fill="none" opacity="0.6" />
                </svg>
            </div>
            <div class="mic-halo"></div>
        </div>

        <p class="status-text" id="status-text">Націсніце на мікрафон для пачатку</p>

        <div class="audio-visualizer" id="visualizer">
            <!-- Visualizer bars will be generated by JS -->
        </div>

        <div class="transcript-box">
            <div class="transcript-box-head">
                <p class="transcript-label">💬 Дыялог</p>
            </div>
            <div class="transcript-history" id="transcript-history">
                <div class="transcript-empty" id="transcript-empty">Размова яшчэ не пачалася</div>
            </div>
        </div>

        <div class="voice-controls">
            <button class="voice-btn primary" id="start-btn">▶ Пачаць</button>
            <button class="voice-btn secondary" id="stop-btn" disabled>■ Спыніць</button>
        </div>

        <section class="teacher-panel" id="teacher-panel">
            <div class="teacher-panel-head">
                <div class="teacher-panel-heading">
                    <span class="teacher-panel-icon">📚</span>
                    <div class="teacher-panel-copy">
                        <span class="teacher-panel-label">Настаўнік</span>
                        <p class="teacher-panel-subtitle">Рэжым урока з жывым дыялогам</p>
                    </div>
                </div>
                <div class="teacher-panel-actions">
                    <label class="teacher-switch" aria-label="Уключыць рэжым настаўніка">
                        <input type="checkbox" id="teacher-toggle">
                        <span class="teacher-switch-slider"></span>
                    </label>
                    <span class="teacher-mode-badge" id="teacher-mode-badge">Выкл.</span>
                    <button class="teacher-panel-toggle" id="teacher-panel-toggle" type="button" hidden aria-label="Згарнуць блок настаўніка">⌃</button>
                </div>
            </div>
            <div class="teacher-panel-summary" id="teacher-panel-summary" hidden></div>
            <div class="teacher-panel-body" id="teacher-panel-body">
                <div class="teacher-panel-row">
                    <label class="teacher-field-label" for="teacher-lesson-select">Тэма занятка</label>
                    <select class="teacher-select" id="teacher-lesson-select" disabled>
                        <option value="">Загрузка ўрокаў...</option>
                    </select>
                </div>
                <div class="teacher-lesson-meta" id="teacher-lesson-meta" hidden></div>
                <p class="teacher-panel-status" id="teacher-status" hidden></p>
            </div>
        </section>
    </div>

    <button class="perf-toggle-btn" id="perf-toggle" title="Логі прадукцыйнасці">
        📊
    </button>

    <div class="perf-panel" id="perf-panel">
        <div class="perf-panel-header">
            <div class="perf-panel-title">📊 Логі прадукцыйнасці</div>
            <div class="perf-panel-actions">
                <button class="perf-action-btn" id="perf-clear">🗑️ Ачысціць</button>
                <button class="perf-action-btn" id="perf-close">✕</button>
            </div>
        </div>
        <div class="perf-panel-body" id="perf-log-body">
            <div class="perf-empty">
                <div class="perf-empty-icon">📊</div>
                <div class="perf-empty-text">Пачніце размову, каб бачыць логі</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.min.js"></script>
    <script>
        if (window.ort) {
            ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/';
            ort.env.wasm.numThreads = 1;
            ort.env.wasm.simd = true;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.18/dist/bundle.min.js"></script>
</body>

</html>
