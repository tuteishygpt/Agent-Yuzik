<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzik Auth Callback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.82);
      --border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Outfit', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.2), transparent 35%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(460px, 100%);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(16px);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .pulse {
      margin-top: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.38);
      animation: pulse 1.8s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.38); }
      70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(56, 189, 248, 0); }
      100% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <p class="eyebrow">Supabase</p>
    <h1 id="auth-status">Signing you in</h1>
    <p id="auth-detail">Completing the callback and returning to the app.</p>
    <div class="pulse" aria-hidden="true"></div>
  </main>
  <script type="module" src="/src/auth-callback.js"></script>
</body>
</html>
